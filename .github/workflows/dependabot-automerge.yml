name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_run:
    workflows: [CI, CodeQL]
    types: [requested, completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged workflow: load only trusted default-branch code, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const automate = require('./.github/scripts/dependabot-automerge.cjs');
            await automate({github, context, core});
