name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.repository == 'SECQUOIA/LD-SDA-Dynamic' &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.user.login == 'dependabot[bot]') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.actor.login == 'dependabot[bot]' ||
         startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
         github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Privileged workflow: load only trusted default-branch code, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const automate = require('./.github/scripts/dependabot-automerge.cjs');
            await automate({github, context, core});
